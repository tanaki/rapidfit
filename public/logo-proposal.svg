<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Fond : dégradé radial, légèrement bleuté en haut-gauche -->
    <radialGradient id="bg" cx="38%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#1c1c30"/>
      <stop offset="100%" stop-color="#08080f"/>
    </radialGradient>

    <!-- Teal : dégradé diagonal du bas-gauche vers le haut-droit -->
    <linearGradient id="teal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#29aaa2"/>
      <stop offset="100%" stop-color="#6ee8e0"/>
    </linearGradient>

    <!-- Glow très léger -->
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- ── Roues ── -->
  <circle cx="26" cy="64" r="14" stroke="white" stroke-width="1.2" fill="none"/>
  <circle cx="74" cy="64" r="14" stroke="white" stroke-width="1.2" fill="none"/>
  <circle cx="26" cy="64" r="1" fill="white"/>
  <circle cx="74" cy="64" r="1" fill="white"/>

  <!-- ── Corps cycliste / éclair ── -->
  <path filter="url(#glow)" fill="url(#teal)"
    d="M41 69 L65 45 L48 45 L63 31 L79 29 L63 28 L42 45 L39 47 L59 47 Z"/>

  <!-- ── Tête du cycliste ── -->
  <circle filter="url(#glow)" cx="67" cy="23" r="4.5" fill="url(#teal)"/>
</svg>
