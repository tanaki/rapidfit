<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0d0d14"/>
  <!-- groupe centré : logo original 41×33, centré dans 100×100 avec padding 14px -->
  <!-- translate pour centrer : x=(100-41)/2=29.5, y=(100-33)/2=33.5 -->
  <g transform="translate(14, 18) scale(1.75)">
    <!-- Éclair / cycliste -->
    <path fill="#4ecdc4" stroke="#4ecdc4" stroke-width="0.5" stroke-linejoin="round" d="M16 28 L29 14 L18.5 14 L27 7 L36.5 6 L27 5 L16 14 L14.5 15.5 L25.5 15.5 Z"/>
    <!-- Roues -->
    <circle cx="7"  cy="25" r="8" stroke="white" stroke-width="1.2" fill="none"/>
    <circle cx="33" cy="25" r="8" stroke="white" stroke-width="1.2" fill="none"/>
    <!-- Hubs -->
    <circle cx="7"  cy="25" r="1" fill="white"/>
    <circle cx="33" cy="25" r="1" fill="white"/>
    <!-- Tête -->
    <circle cx="33" cy="3" r="2" fill="#4ecdc4"/>
  </g>
</svg>
