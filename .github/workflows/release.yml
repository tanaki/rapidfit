name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main process
        env:
          ELECTRON: 'true'
        run: |
          npx tsc -b
          npx vite build

      - name: Package & publish Mac
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ELECTRON: 'true'
        run: npx electron-builder --mac --publish always

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main process
        env:
          ELECTRON: 'true'
        run: |
          npx tsc -b
          npx vite build

      - name: Package & publish Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ELECTRON: 'true'
        run: npx electron-builder --win --publish always
