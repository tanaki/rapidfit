name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # opt-in to Node.js 24 for actions

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main process
        env:
          ELECTRON: 'true'
        run: |
          npx tsc -b
          npx vite build

      - name: Package & publish Mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON: 'true'
        run: npx electron-builder --mac --publish always

  build-win:
    runs-on: windows-2022  # pin to stable version (windows-latest → windows-2025 from June 2026)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main process
        env:
          ELECTRON: 'true'
        run: |
          npx tsc -b
          npx vite build

      - name: Package & publish Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON: 'true'
        run: npx electron-builder --win --publish always
