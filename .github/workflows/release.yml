name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main process
        env:
          ELECTRON: 'true'
          GH_UPDATE_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
        run: |
          npx tsc -b
          npx vite build

      - name: Package & publish Mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_UPDATE_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
          ELECTRON: 'true'
        run: npx electron-builder --mac --publish always

  build-win:
    runs-on: windows-2022  # pin to stable version (windows-latest → windows-2025 from June 2026)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main process
        env:
          ELECTRON: 'true'
          GH_UPDATE_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
        run: |
          npx tsc -b
          npx vite build

      - name: Package & publish Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_UPDATE_TOKEN: ${{ secrets.GH_UPDATE_TOKEN }}
          ELECTRON: 'true'
        run: npx electron-builder --win --publish always
